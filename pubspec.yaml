name: attendease
description: "Student Attendance Portal - Production-Ready Student Attendance Mobile App with Local SQLite Database"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Local SQLite database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # State management & Local Key-Value Persistence
  provider: ^6.1.2
  shared_preferences: ^2.2.3

  # Formatting & UI
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  sqflite_common_ffi_web: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
